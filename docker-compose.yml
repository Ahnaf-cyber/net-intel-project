services:
  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: net-intel-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - ch_data:/var/lib/clickhouse

volumes:
  ch_data:
    external: true
    name: ch_data
